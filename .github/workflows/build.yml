name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    # Versión fija: "ubuntu-latest" ya migró a Ubuntu 26 y puede romper la compilación
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Instalar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Dependencias del sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip autoconf libtool pkg-config \
            zlib1g-dev libncurses-dev cmake libffi-dev libssl-dev build-essential ccache

      - name: Instalar Buildozer
        run: |
          python -m pip install --upgrade pip
          pip install buildozer "cython==0.29.34" setuptools

      - name: Compilar APK
        run: buildozer -v android debug

      - name: Subir el APK
        uses: actions/upload-artifact@v4
        with:
          name: galeria-apk
          path: bin/*.apk
